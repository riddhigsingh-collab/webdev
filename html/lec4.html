<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><i>STUDENT REGISTRATION FORM</i></h1>
    <hr>
    <forms>
        <label for="name">Name:</label><br>
        <input type="text">
        <br><br>
        <label for="pass">Password</label><br>
        <input type="password" placeholder="xyz234">
        <br><br>
        <label for="email">Email:</label><br>
        <input type="email" placeholder="abc@gmail.com">
        <br><br>
        <label for="date">Date:</label><br>
        <input type="date">
        <br><br>
        <label for="age">AGE:</label><br>
        <input type="age">
        <br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male">
        <label>Male</label><br>
        <input type="radio" name="gender" value="female">
        <label>Female</label><br>
        <input type="radio" name="gender" value="other">
        <label>Other</label><br>
        <br><br>
        <label>Languages You Know:</label><br>
        <input type="checkbox" name="lang" value="Python">
        <label>Python</label><br>
        <input type="checkbox" name="lang" value="C++">
        <label>C++</label><br>
        <input type="checkbox" name="lang" value="Java">
        <label>Java</label><br>
        <input type="checkbox" name="lang" value="Html">
        <label>Html</label><br>
        <br><br>
        <label>Branch</label><br>
        <select>
            <option selected>CSE</option>
            <option>AI/ML</option>
            <option>Data Science</option>
            <option>Cyber Security</option>
        </select><br>
        <br><br>
        <label>Why did you choose this stream?</label><br>
        <textarea rows="5" cols="40"></textarea>
        <br><br>
        <button>SUBMIT</button>
    </forms>
</body>
</html>
